name: Sirius integration probe

on:
  workflow_dispatch:
  push:
    branches:
      - v1.5-sirius-ci

permissions:
  contents: read

concurrency:
  group: sirius-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      extension_config: ${{ steps.config.outputs.extension_config }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        shell: bash
        run: |
          {
            echo 'extension_config<<EOF'
            cat .github/config/extensions/sirius.cmake
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build:
    needs: config
    uses: ./.github/workflows/_extension_distribution.yml
    with:
      artifact_prefix: sirius-probe
      extension_config: ${{ needs.config.outputs.extension_config }}
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads'
      extra_toolchains: 'rust'
      skip_tests: false
