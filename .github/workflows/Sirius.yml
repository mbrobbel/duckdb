name: Sirius v2 integration probe

on:
  workflow_dispatch:
  push:
    branches:
      - v2-sirius-ci

permissions:
  contents: read
  packages: read

concurrency:
  group: sirius-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: mbrobbel/extension-ci-tools/.github/workflows/build.yml@df99a32a6898f0162101fefeebbec8f5bea7cadd
    with:
      duckdb_version: v2.0-cyanoptera
      duckdb_commit: ${{ github.sha }}
      duckdb_repository: ${{ github.repository }}
      extension_repository: duckdb/extension-template
      extension_ref: main
      ci_tools_repository: mbrobbel/extension-ci-tools
      ci_tools_version: df99a32a6898f0162101fefeebbec8f5bea7cadd
      cuda12_archs: "75-real;80-real;86-real;89-real;90a-real"
      cuda13_archs: "75-real;80-real;86-real;89-real;90a-real;100f-real;120a-real;120"
      image_version: 20260923-ade72a46
      groups: |
        cuda12:
          config: duckdb/.github/config/extensions/sirius_cuda12.cmake
          toolchain: cuda12
        cuda13:
          config:
            - duckdb/.github/config/extensions/sirius.cmake
            - duckdb/.github/config/extensions/sirius_cuda13.cmake
          toolchain: cuda13
      exclude_archs: linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads
      reduced_ci_mode: disabled
      skip_tests: true
      save_cache: false
